<style>
@font-face{font-family:GothamBlack;font-weight:900;src:url(data:font/otf;base64,__FONT__) format('opentype')}
:root{--gx-bg:#0a0e0d;--gx-surface:#121715;--gx-surface-2:#161c1a;--gx-surface-3:#1a221f;--gx-border:#232a27;--gx-border-strong:#2e3733;--gx-text:#e6ece9;--gx-text-dim:#8a958f;--gx-text-mute:#5e6864;--gx-green:#4ade80;--gx-green-bright:#5ee68f;--gx-green-dim:#2f8a52;--gx-green-ink:#06210f;--gx-green-soft:rgba(74,222,128,.10);--gx-amber:#d4a847;--gx-red:#ef4444;--stage:#ececeb;--gx-font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{margin:0;background:var(--gx-bg);color:var(--gx-text);font-family:var(--gx-font);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;background-image:radial-gradient(ellipse at 50% -10%,rgba(74,222,128,.07),transparent 55%);background-repeat:no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(10,14,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--gx-border)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center}
.wm{font-weight:900;font-size:19px;letter-spacing:.5px;white-space:nowrap}.wm b{color:var(--gx-green);font-weight:900}
.wm .logo{height:24px;width:auto;vertical-align:middle;display:inline-block}.wm small{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gx-text-mute);font-weight:600;margin-left:10px}
.search{flex:1}
.in{width:100%;background:var(--gx-surface-3);border:1px solid var(--gx-border);border-radius:6px;color:var(--gx-text);padding:9px 12px;font-size:14px;outline:0;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--gx-green-dim);box-shadow:0 0 0 3px var(--gx-green-soft)}.in::placeholder{color:var(--gx-text-mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:transparent;color:var(--gx-text-dim);border:1px solid var(--gx-border-strong);border-radius:6px;padding:7px 13px;font-size:12px;cursor:pointer;transition:color .15s,border-color .15s,background .15s,transform .06s;white-space:nowrap}
.btn:hover{color:var(--gx-text);border-color:var(--gx-green)}.btn:active{transform:scale(.985)}
.btn.g{background:var(--gx-green);border-color:var(--gx-green);color:var(--gx-green-ink);font-weight:700}.btn.g:hover{background:var(--gx-green-bright);border-color:var(--gx-green-bright);color:var(--gx-green-ink)}
.btn[disabled]{opacity:.55;cursor:default}.btn.lg{padding:10px 16px;font-size:13px}
.cnt{background:#fff;color:var(--gx-green-dim);border-radius:999px;padding:0 7px;font-size:11px;font-weight:700}
main{max-width:1180px;margin:0 auto;padding:6px 16px 60px}
.sh{display:flex;align-items:baseline;gap:14px;margin:22px 0 10px}.sh h2{margin:0;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--gx-text-mute);font-weight:500}.sh .sep{color:var(--gx-border-strong)}.sh .d{font-size:11px;color:var(--gx-text-mute)}
.lbl{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--gx-text-mute);font-weight:500;margin:16px 0 6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--gx-border);background:transparent;color:var(--gx-text-dim);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap;font-size:12px}
.tab:hover{color:var(--gx-text);border-color:var(--gx-border-strong)}.tab.on{color:var(--gx-green);border-color:var(--gx-green-dim);background:var(--gx-green-soft);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--gx-surface);border:.5px solid var(--gx-border);border-radius:8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--gx-green-dim);transform:translateY(-2px)}
.im{aspect-ratio:4/3;background:var(--stage);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.im img,.im svg{width:100%;height:100%;object-fit:contain;display:block}
.card .bd{background:#ececeb;color:#0b0d0c}.card .bd .tg{color:#444a47}.card .bd .btn.g{background:#16a34a;border-color:#16a34a;color:#fff}
.bd{padding:11px 13px 13px;display:flex;flex-direction:column;gap:3px;flex:1}.bd h3{margin:0;font-size:13.5px;font-weight:500}.tg{color:var(--gx-text-dim);font-size:12px}
.ft{margin-top:auto;padding-top:9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{position:absolute;top:9px;left:9px;background:var(--gx-surface);border:1px solid var(--gx-border-strong);border-radius:999px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:2px 9px;font-weight:700;color:var(--gx-amber)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}.ov.on{display:flex}
.modal{background:var(--gx-surface);border:.5px solid var(--gx-border-strong);border-radius:8px;max-width:940px;width:100%;display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden;position:relative;box-shadow:0 28px 70px rgba(0,0,0,.5)}
.gal{background:var(--gx-surface-2);padding:14px}.gal .main{background:var(--stage);border-radius:8px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}.gal .main img,.gal .main svg{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:8px;margin-top:8px}.th{width:72px;height:54px;background:var(--stage);border:2px solid transparent;border-radius:6px;cursor:pointer;overflow:hidden;display:flex}.th img,.th svg{width:100%;height:100%;object-fit:contain}.th.on{border-color:var(--gx-green)}
.inf{padding:20px 22px}.inf h2{margin:0 0 2px;font-size:20px;font-weight:500}.x{position:absolute;right:10px;top:10px;border:1px solid var(--gx-border-strong);background:var(--gx-surface);border-radius:999px;width:30px;height:30px;font-size:18px;cursor:pointer;z-index:2;line-height:1}
.vars{display:flex;gap:7px;flex-wrap:wrap}.vr{border:1px solid var(--gx-border-strong);background:transparent;border-radius:6px;padding:7px 11px;cursor:pointer;font-size:12.5px;color:var(--gx-text-dim)}.vr.on{border-color:var(--gx-green);background:var(--gx-green-soft);color:var(--gx-green);font-weight:600}
table.sp{width:100%;border-collapse:collapse;font-size:12.5px}table.sp td{padding:6px 0;border-bottom:1px solid var(--gx-border)}table.sp td:first-child{color:var(--gx-text-mute);width:36%}
.qty{display:inline-flex;align-items:center;border:1px solid var(--gx-border-strong);border-radius:6px;overflow:hidden}.qty button{border:0;background:var(--gx-surface-3);width:32px;height:34px;font-size:16px;cursor:pointer}.qty button:hover{color:var(--gx-green)}.qty input{width:44px;text-align:center;border:0;height:34px;background:var(--gx-surface);-moz-appearance:textfield;outline:0}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.note{font-size:12px;color:var(--gx-text-mute);margin:6px 0 0}.soonbox{background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.3);color:#d4a847;border-radius:8px;padding:10px 12px;margin-top:12px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--gx-surface);border-left:1px solid var(--gx-border-strong);z-index:50;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.5)}.drawer.on{transform:none}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--gx-border);display:flex;justify-content:space-between;align-items:center}.drawer .hd h2{margin:0;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gx-text-dim)}
.drawer .bdy{flex:1;overflow:auto;padding:4px 16px}.drawer .fd{padding:14px 16px;border-top:1px solid var(--gx-border)}
.ln{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--gx-border);align-items:center}.ln .t0{width:72px;height:54px;background:var(--stage);border-radius:6px;overflow:hidden;display:flex}.ln .t0 img,.ln .t0 svg{width:100%;height:100%;object-fit:contain}
.ln .t{font-weight:600;font-size:13px}.ln .s{color:var(--gx-text-dim);font-size:12px}.rm{border:0;background:none;color:var(--gx-text-mute);cursor:pointer;font-size:12px;text-decoration:underline;padding:0}.rm:hover{color:var(--gx-red)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.fld label{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--gx-text-dim)}select.in{appearance:auto}
.err{color:var(--gx-red);font-size:12.5px;margin:6px 0}
.sheet{background:var(--gx-surface);border:1px solid var(--gx-border-strong);border-radius:12px;padding:20px;max-width:640px;width:100%;margin:20px auto}.sheet h2{margin:0 0 10px;font-size:18px}
pre.em{white-space:pre-wrap;background:var(--gx-surface-3);border:1px solid var(--gx-border);border-radius:8px;padding:12px;font-size:12.5px;max-height:260px;overflow:auto;margin:0}
.empty{color:var(--gx-text-mute);padding:44px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--gx-green);color:var(--gx-green-ink);padding:8px 16px;border-radius:999px;z-index:70;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
.cust .in{font-family:GothamBlack,var(--gx-font);font-weight:900;text-transform:uppercase;letter-spacing:.5px;font-size:15px}
body.gated .top,body.gated main{display:none}
.who{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.asme{background:var(--gx-surface-3);border:1px solid var(--gx-border);border-radius:6px;padding:9px 12px;font-size:14px}
@media(max-width:760px){.who{display:none}.modal{grid-template-columns:1fr}.wm small{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:9px}}

<script>
const DATA=__DATA__;
const IMG=__IMG__;
const APP_VERSION='v1.004'; /* deploy.sh reads this; bump on each ship (vMAJOR.BBB) */
/* GX Core: sign-in, the live store list, and the one write — submit_display_order, which emails Sky.
   The server decides everything that matters: who is ordering (from the session), whether they may
   (a manager on any app), which store, which items. This page only collects and shows. */
const GXCORE_URL='https://script.google.com/macros/s/AKfycbx9mjeCBbDpxNYaqBv2hyZaO1hpbGG6PZM9AebFdwl0UwkdtRCGSWrH-8ohEtdF1K_6/exec';
const GX=GXClient(GXCORE_URL,{retries:3});
const SESSION_KEY='displayshop_session';
const EDIT_ROLES=['manager','director','editor','admin'];
/* Offline fallback only; the live list comes from GX Core ?action=stores on load. Display names are the
   registry's (Century = Bend, Baseline = Hillsboro), and the store_id is what is sent. */
let STORES=[{id:'bend',name:'Century'},{id:'center',name:'Center'},{id:'commercial',name:'Commercial'},{id:'hillsboro',name:'Baseline'},{id:'portland-rd',name:'Portland'},{id:'river-rd',name:'River'}];
function expiryMs(v){const n=Number(v);if(isFinite(n)&&n>0)return n;const t=Date.parse(v);return isNaN(t)?0:t}
/* The sign-in lives in localStorage so it survives closing the tab (Sky, 2026-11-23: store computers are
   private, and the token's own expiresAt still ends it). Up to v1.003 it lived in sessionStorage, so a
   session found only there is moved over once and the old copy removed. Sign-out clears both. */
function readSessionRaw(){let raw=null;try{raw=localStorage.getItem(SESSION_KEY)}catch(e){}
 if(raw)return raw;
 try{const old=sessionStorage.getItem(SESSION_KEY);if(old){try{localStorage.setItem(SESSION_KEY,old)}catch(e){}sessionStorage.removeItem(SESSION_KEY);return old}}catch(e){}
 return null}
function getSession(){try{const s=JSON.parse(readSessionRaw()||'null');if(s&&s.token&&(!s.expiresAt||expiryMs(s.expiresAt)>Date.now()))return s}catch(e){}return null}
function setSession(s){try{localStorage.setItem(SESSION_KEY,JSON.stringify(s))}catch(e){}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch(e){}try{sessionStorage.removeItem(SESSION_KEY)}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const src=k=>IMG[k]||'';
/* units: inches first, (mm) after */
const inch=mm=>(mm/25.4).toFixed(2)+' in';
const mmS=mm=>(mm<100?(Math.round(mm*10)/10).toString():Math.round(mm).toString())+' mm';
const dim=mm=>inch(mm)+' ('+mmS(mm)+')';
function fmt(s){return String(s).replace(/(\d+(?:\.\d+)?) × (\d+(?:\.\d+)?) mm/g,(m,a,b)=>inch(+a)+' × '+inch(+b)+' ('+a+' × '+b+' mm)').replace(/(\d+(?:\.\d+)?) mm/g,(m,a)=>dim(+a))}
/* name plates: same spec as the placard generator (cap 12.5, margin 6, length = wordmark + 12) */
const PL={cap:12.5,emboss:2,plateT:2,lean:30,height:21,foot:18,footT:3,margin:6,em:12.5/0.7};
let _ctx=null;
function w100(t){try{if(!_ctx)_ctx=document.createElement('canvas').getContext('2d');_ctx.font='900 100px GothamBlack';return _ctx.measureText(t).width}catch(e){return t.length*69}}
const plateCache={};
function plateGeo(name){name=name.toUpperCase();if(plateCache[name])return plateCache[name];const word=w100(name)/100*PL.em;const g={name,word,L:word+2*PL.margin};try{if(document.fonts.check('900 20px GothamBlack'))plateCache[name]=g}catch(e){}return g}
/* same camera as the product renders */
const RAD=Math.PI/180,AZ=35*RAD,EL=28*RAD;
function proj(p){const x=p[0],y=p[2],z=-p[1];const x1=Math.cos(AZ)*x+Math.sin(AZ)*z,z1=-Math.sin(AZ)*x+Math.cos(AZ)*z;
 return[x1,Math.cos(EL)*y-Math.sin(EL)*z1,Math.sin(EL)*y+Math.cos(EL)*z1]}
const O3=proj([0,0,0]);
const rotV=v=>{const a=proj(v);return[a[0]-O3[0],a[1]-O3[1],a[2]-O3[2]]};
const LV=(()=>{const l=[-.45,.65,.62],m=Math.hypot(...l);return l.map(v=>v/m)})();
function shade(n,base){const m=Math.hypot(...n)||1;const d=Math.max(0,(n[0]*LV[0]+n[1]*LV[1]+n[2]*LV[2])/m);const v=Math.round(255*base*(.40+.60*d));return 'rgb('+v+','+v+','+(v+1)+')'}
function plateSVG(name){
 const g=plateGeo(name),L=g.L,c=Math.cos(PL.lean*RAD),s=Math.sin(PL.lean*RAD),S=PL.height/c,t=PL.plateT,x0=-L/2,x1=L/2;
 const q2=[S*s+t*c,S*c-t*s],q=[[0,0],[S*s,S*c],q2,[q2[0]-q2[1]*s/c,0]];
 const sp=[...q.map(a=>[x0,a[0],a[1]]),...q.map(a=>[x1,a[0],a[1]])];
 const slabF=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]];
 const fp=[[x0,0,0],[x1,0,0],[x1,PL.foot,0],[x0,PL.foot,0],[x0,0,PL.footT],[x1,0,PL.footT],[x1,PL.foot,PL.footT],[x0,PL.foot,PL.footT]];
 const footF=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];
 const all=[];
 const add=(pts,faces,grp)=>{const bc=[0,1,2].map(i=>pts.reduce((a,p)=>a+p[i],0)/pts.length);faces.forEach(f=>{const P=f.map(i=>pts[i]);const a=[0,1,2].map(i=>P[1][i]-P[0][i]),b=[0,1,2].map(i=>P[2][i]-P[0][i]);
  let n=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];const fc=[0,1,2].map(i=>P.reduce((u,p)=>u+p[i],0)/P.length);
  if(n[0]*(fc[0]-bc[0])+n[1]*(fc[1]-bc[1])+n[2]*(fc[2]-bc[2])<0)n=n.map(v=>-v);
  all.push({rn:rotV(n),pp:P.map(proj),grp})})};
 add(fp,footF,0);add(sp,slabF,1);
 let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;all.forEach(f=>f.pp.forEach(p=>{mnx=Math.min(mnx,p[0]);mxx=Math.max(mxx,p[0]);mny=Math.min(mny,-p[1]);mxy=Math.max(mxy,-p[1])}));
 const W=640,H=480,k=Math.min(W*.84/(mxx-mnx),H*.62/(mxy-mny)),cx=(mnx+mxx)/2,cy=(mny+mxy)/2;
 const T=p=>[(p[0]-cx)*k+W/2,(-p[1]-cy)*k+H/2];
 const vis=all.filter(f=>f.rn[2]>0).map(f=>({...f,d:f.pp.reduce((a,p)=>a+p[2],0)/f.pp.length}));
 const draw=grp=>vis.filter(f=>f.grp===grp).sort((a,b)=>a.d-b.d).map(f=>{const col=shade(f.rn,.16);return '<polygon points="'+f.pp.map(p=>T(p).map(v=>v.toFixed(1)).join(',')).join(' ')+'" fill="'+col+'" stroke="'+col+'" stroke-width=".6"/>'}).join('');
 const vx=rotV([1,0,0]),vt=rotV([0,s,c]),vn=rotV([0,-c,s]);
 const vb=(S-PL.cap)/2,b0=T(proj([x0+PL.margin,vb*s,vb*c]));
 const a=vx[0]*k,b=-vx[1]*k,cc=-vt[0]*k,dd=vt[1]*k;
 let txt='';const steps=6;
 for(let i=0;i<=steps;i++){const e=PL.emboss*i/steps,ox=vn[0]*k*e,oy=-vn[1]*k*e,col=i===steps?'#f4f4f2':'rgb('+Math.round(120+60*i/steps)+','+Math.round(120+60*i/steps)+','+Math.round(122+60*i/steps)+')';
  txt+='<text transform="matrix('+[a,b,cc,dd,b0[0]+ox,b0[1]+oy].map(v=>+v.toFixed(3)).join(' ')+')" font-family="GothamBlack" font-weight="900" font-size="'+PL.em.toFixed(3)+'" fill="'+col+'">'+esc(g.name)+'</text>'}

function plateDimSVG(name){

function loadStores(){return GX.jsonp('stores',{}).then(r=>{const list=((r&&r.stores)||[]).filter(s=>s.store_id&&s.display_name&&!s.is_closed)
  .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(s=>({id:s.store_id,name:s.display_name}));if(list.length)STORES=list}).catch(()=>{})}
let storesP=Promise.resolve();
function start(){const s=getSession();if(!s){hideLoader(false);renderGate('');return}
 showLoader();
 document.body.classList.remove('gated');$('#gate').innerHTML='';
 $('#who').textContent=(s.name||s.user)+' · Sign out';$('#who').onclick=()=>signOut('');
 count();render();
 /* ready = the live store list has answered (or failed to; the offline list then stands) */
 storesP.then(()=>hideLoader(true),()=>hideLoader(true))}
$('#q').oninput=e=>{query=e.target.value;render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#pov').classList.remove('on');$('#drawer').classList.remove('on')}});
/* Portal tile: a one-time #gxcode= is traded for this app's normal session, then the page reloads signed in.
   No code (the usual case) does nothing; the password form stays as it is. */
if(window.GXHandoff&&GXHandoff.code)GXHandoff.run({app:'displayshop',save:r=>setSession(sessionFromLogin(r)),current:()=>{const s=getSession();return s?s.user:null}});
storesP=loadStores();start();
try{document.fonts.load('900 100px GothamBlack').then(()=>{Object.keys(plateCache).forEach(k=>delete plateCache[k]);render()}).catch(()=>{})}catch(e){}
</script></body></html>
